# Builds ThaiKeyboard.app and attaches a zip of it to a GitHub Release, so
# people can install it without Xcode.
#
# Run it by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
#
# The app is signed ad hoc (no paid Apple Developer ID), so macOS asks the
# user to allow it once on first open; see the README.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build universal app (Apple silicon + Intel), signed ad hoc
        env:
          SIGN_IDENTITY: "-"
          ARCH_FLAGS: "--arch arm64 --arch x86_64"
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --no-install

      - name: Zip the app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent .build/ThaiKeyboard.app "ThaiKeyboard-${VERSION}.zip"
          shasum -a 256 "ThaiKeyboard-${VERSION}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "ThaiKeyboard-${VERSION}.zip" \
            --title "Thai Keyboard Visualiser ${VERSION}" \
            --notes "Download **ThaiKeyboard-${VERSION}.zip**, unzip it, and move ThaiKeyboard.app to Applications. Requires macOS 26 or later. The first time you open it, macOS will say it can't verify the developer: see [Download the app](https://github.com/${GITHUB_REPOSITORY}#download-the-app) in the README for how to allow it."
